name: posts from VK
on:
  schedule:
    # GitHub запускает расписание с опозданием, на деле раз в несколько часов: обещаем «в течение дня»
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vk-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==11.1.0
      - name: Read the VK group and update «Новые работы»
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          if [ -z "$VK_TOKEN" ]; then echo "VK_TOKEN secret is not set yet, skipping"; exit 0; fi
          python _sync/sync.py
      - name: Commit if something changed
        run: |
          git add -A index.html img/w
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git -c user.name="vk-sync" -c user.email="actions@users.noreply.github.com" commit -m "Новые работы из группы ВК"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
